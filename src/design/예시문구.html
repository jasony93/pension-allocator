<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>절세계좌 계산기 — 히어로 카피 (안2 · 단순화)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #FFFFFF;
    --text-primary: #14181F;
    --text-body: #4B5568;
    --text-muted: #6B7280;
    --accent: #E2711D;       /* 큰 요소(헤드라인 강조)용 밝은 오렌지 */
    --strike: #A2A9B8;
    --strike-line: #C1440E;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  /* ===== 카피 컴포넌트 (실제로 복사해서 쓸 부분) ===== */
  .copy {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  .headline {
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(1.875rem, 1.1rem + 2.6vw, 3.0625rem);
    line-height: 1.28;
    color: var(--text-primary);
  }
  .headline span.line {
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  .headline span.line:nth-child(1) { animation-delay: 0.05s; }
  .headline span.line:nth-child(2) { animation-delay: 0.18s; }
  .headline span.line:nth-child(3) { animation-delay: 0.31s; }

  .strike {
    color: var(--strike);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--strike-line);
  }
  .mark {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(226, 113, 29, 0.45);
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
  }

  .body-copy {
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.46s;
  }
  .body-copy p {
    margin: 0;
    font-size: clamp(1rem, 0.92rem + 0.3vw, 1.125rem);
    font-weight: 500;
    line-height: 1.65;
    color: var(--text-body);
  }
  .body-copy p strong { color: var(--text-primary); font-weight: 700; }

  /* 강조 문구 — 별도 박스 없이 타이포그래피로만 강조 */
  .promise {
    margin: 0;
    font-size: clamp(1.25rem, 1.05rem + 1vw, 1.625rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.4;
    color: var(--text-primary);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.6s;
  }

  .caption {
    margin: 0;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-muted);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.72s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .headline span, .body-copy, .promise, .caption {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div class="copy">
    <h1 class="headline">
      <span class="line">세액공제는</span>
      <span class="line"><span class="strike">무조건</span> 받는 게 아니라</span>
      <span class="line"><span class="mark">따져보고</span> 받는 것입니다</span>
    </h1>

    <div class="body-copy">
      <p><strong>3년 안에 집을 산다면</strong>, 연금저축이 오히려 손해일 수 있습니다.</p>
      <p><strong>소득이 없다면</strong>, IRP는 애초에 가입도 안 됩니다.</p>
    </div>

    <p class="promise">넣어야 할 때와, 넣지 말아야 할 때를 알려드립니다.</p>

    <p class="caption">증권사 계산기가 하지 않는 이야기까지.</p>
  </div>
</body>
</html>
