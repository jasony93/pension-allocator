<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>국민연금 고갈 팝업 카피</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #FFFFFF;
    --text-primary: #14181F;
    --text-body: #4B5568;
    --text-muted: #6B7280;
    --accent: #E2711D;
    --accent-dark: #B75812;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  /* ===== 팝업 카피 (복사해서 쓸 부분) ===== */
  .popup-copy {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .question {
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(1.5rem, 1.15rem + 1.6vw, 2.125rem);
    line-height: 1.32;
    color: var(--text-primary);
  }
  .question span.line {
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  .question span.line:nth-child(1) { animation-delay: 0.05s; }
  .question span.line:nth-child(2) { animation-delay: 0.16s; }

  .answer {
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: clamp(1.25rem, 1.02rem + 1vw, 1.6875rem);
    line-height: 1.42;
    color: var(--text-primary);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.32s;
  }
  .mark {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(226, 113, 29, 0.45);
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
  }

  .body-copy {
    display: flex;
    flex-direction: column;
    gap: 0.875rem;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.48s;
  }
  .body-copy p {
    margin: 0;
    font-size: clamp(0.9375rem, 0.9rem + 0.2vw, 1.0625rem);
    font-weight: 500;
    line-height: 1.65;
    color: var(--text-body);
  }
  .body-copy p strong { color: var(--text-primary); font-weight: 700; }

  /* 계좌 3종 — 주황색 굵은 글씨 */
  .account {
    color: var(--accent-dark);
    font-weight: 800;
  }

  .source {
    margin: 0;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text-muted);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.62s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .question span, .answer, .body-copy, .source {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div class="popup-copy">
    <h2 class="question">
      <span class="line">국민연금이 고갈되면</span>
      <span class="line">연금 받을 수 있나요?</span>
    </h2>

    <p class="answer">
      받습니다. 다만 법이 보장하는 건<br />
      <span class="mark">지급</span>이지 <span class="mark">금액</span>이 아닙니다.
    </p>

    <div class="body-copy">
      <p>기금 소진은 2064년으로 미뤄졌을 뿐입니다.</p>
      <p>
        <strong>국민연금은 바닥이지, 전부가 아닙니다.</strong><br />
        나머지는 <span class="account">ISA</span>·<span class="account">연금저축</span>·<span class="account">IRP</span>로 채워야 합니다.
      </p>
    </div>

    <p class="source">국민연금법 제3조의2 (2026.1.1 시행)</p>
  </div>
</body>
</html>
